name: filesdrop-dev

services:
  postgres:
    image: postgres:16.5-alpine
    container_name: filesdrop-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ti96rmFZaa9XIo8zdhFC
      POSTGRES_DB: filesdrop
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
